name: github pages

on:
  push:
    branches:
      - main # Set a branch that will trigger a deployment
  pull_request:

permissions:
  contents: write # required to push the built site to the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: true # never run two deploys against gh-pages at once

jobs:
  deploy:
    # Pinned: ubuntu-latest migrates to Ubuntu 26.04 (actions/runner-images#14748)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7 # v4 targets the deprecated Node.js 20 runtime
        with:
          submodules: true # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build
        run: |
          find static -name '.DS_Store' -delete
          hugo --gc --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
